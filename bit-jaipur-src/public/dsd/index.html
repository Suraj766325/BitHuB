<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>
    /* Hosts with clean URLs (Vercel "cleanUrls") serve this folder as ".../dsd" without the slash, and relative paths
     * would then point at the parent folder. Restore the slash first, and only then add the page's own files: they are
     * written by script, so the browser does not request them early from the wrong folder. */
    window.DSD_BOOT = /\/$|\.html$/.test(location.pathname);
    if (!DSD_BOOT) location.replace(location.pathname + '/' + location.search + location.hash);
    else document.write('<link rel="stylesheet" href="css/dsd.css">');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSD Lab Simulator · BitHub</title>
  <meta name="description" content="Breadboard and trainer-kit simulator for the Digital System Design lab: build every experiment of the lab manual on a virtual breadboard with real IC models, a 555 transient solver and a Xilinx ISE Verilog workflow.">
  <meta name="theme-color" content="#4A0E0E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c65575'/%3E%3Crect x='9' y='8' width='14' height='16' rx='2' fill='%23fff'/%3E%3Cg fill='%23fff'%3E%3Crect x='5' y='10' width='4' height='2'/%3E%3Crect x='5' y='15' width='4' height='2'/%3E%3Crect x='5' y='20' width='4' height='2'/%3E%3Crect x='23' y='10' width='4' height='2'/%3E%3Crect x='23' y='15' width='4' height='2'/%3E%3Crect x='23' y='20' width='4' height='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="dsd-app"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">The DSD lab simulator needs JavaScript.</p></noscript>

  <script>
    /* the simulator's scripts, in order (see the note in <head>) */
    if (window.DSD_BOOT) document.write([
      "core/logic.js",
      "core/ics.js",
      "core/board.js",
      "core/sim.js",
      "core/analog.js",
      "core/refbuild.js",
      "core/experiments.js",
      "core/checks.js",
      "core/verilog.js",
      "web/util.js",
      "web/kit.js",
      "web/sheets.js",
      "web/scope.js",
      "web/manual.js",
      "web/ise.js",
      "web/tour.js",
      "web/app.js"
    ].map(function (s) { return '<script src="' + s + '"><\/script>'; }).join(''));
  </script>
</body>
</html>
